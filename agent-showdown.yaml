# Built-in contestants. Every entry becomes its own strands agent talking to its own
# OpenAI-compatible endpoint, so the same code can play against several models at once.
# Delete this file to fall back to these very defaults.
#
# thinking: false is the difference between a turn that takes minutes and one that takes
# seconds. It is sent as both the Qwen chat-template switch and `reasoning_effort`, because
# vLLM honours the first and LM Studio the second.
#
# max_tokens is the *output* budget, not the context window. With thinking off the answer is
# under 100 tokens; the budget only matters when thinking is on.
# Rounds per match; a match ends sooner once one robot is left standing. The arena plays matches
# back to back forever, pausing only while no robot is registered.
max_rounds: 100

# Wandering stand-ins seated at startup, for a lively board with no model endpoints up.
dummies: 1

# Scenery. A fresh layout is dealt for every match: stone walls are grown as connected runs that
# turn at right angles and sometimes leave a doorway, then trees, boulders and a single stone well
# are scattered over what is left. Nothing walks onto an obstacle and no bolt flies through one, and no obstacle is
# ever laid on a corner a robot sits down on, or beside one.
terrain:
  enabled: true
  min_walls: 1        # structures, not cells
  max_walls: 2
  min_run: 2          # cells laid before the wall turns or leaves a gap
  max_run: 4
  max_turns: 2        # right-angle turns one structure may take
  gap_in: 4           # a 1-in-4 chance of a doorway instead of a turn; 0 for none
  min_trees: 2
  max_trees: 5
  min_boulders: 2
  max_boulders: 5
  well: true          # the arena's one landmark; there is never a second
  # A fresh layout for every round rather than once per match. Off: cover that moved every round
  # left nothing worth taking. Turn it on to have the arena re-dealt at every round boundary.
  redeal_each_round: false

agents:
  - name: qwen3.6-35b
    base_url: http://vllm.brain.home.arpa/v1
    model_id: qwen3.6-35b
    thinking: false
    max_tokens: 16384
    timeout: 300.0
    # api_key: EMPTY    # servers that want no auth still need a value here
    # max_actions: 4    # what the prompt asks for; the rules cap a turn at 8

  - name: gemma-4-e4b
    base_url: http://localhost:1234/v1
    model_id: google/gemma-4-e4b
    thinking: false
    max_tokens: 16384
    timeout: 300.0

  # The LM Studio seat before gemma. A reasoning model like gemma, and like it,
  # honours reasoning_effort: "none" — but around three times slower per turn.
  # - name: qwen3.8-27b
  #   base_url: http://localhost:1234/v1
  #   model_id: qwen/qwen3.8-27b
  #   thinking: false
  #   max_tokens: 16384
  #   timeout: 300.0
