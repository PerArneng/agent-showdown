<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Robots</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <aside>
      <div class="title-container">
        <img src="/src/assets/title-magic-robots.png" alt="MAGIC ROBOTS" class="title-logo" />
        <h1 class="sr-only">Magic Robots</h1>
      </div>
      <button id="start">Start game</button>
      <h2>Players</h2>
      <ul id="players"></ul>
      <div id="status">Waiting.</div>
    </aside>
    <main><canvas id="board" width="600" height="600"></canvas></main>
    <div id="connection" class="connection-status disconnected">
      <span class="connection-icon" aria-hidden="true"></span>
      <span class="connection-label">Disconnected</span>
    </div>
  </body>
</html>
