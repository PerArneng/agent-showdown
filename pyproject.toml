[project]
name = "agent-showdown"
version = "0.1.0"
description = "agent-showdown CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dependency-injector>=4.41",
    "fastapi>=0.141.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "uvicorn>=0.52.4",
]

[project.scripts]
agent-showdown = "agent_showdown.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The built client is gitignored, so it must be named explicitly or the sdist drops it and
# `uv build` (which builds the wheel from the sdist) cannot find it.
[tool.hatch.build]
artifacts = ["web_client/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_showdown"]

# The client is a separate project. Build it before building a wheel:
#   npm --prefix web_client install && npm --prefix web_client run build
[tool.hatch.build.targets.wheel.force-include]
"web_client/dist" = "agent_showdown/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
