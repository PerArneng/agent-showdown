[project]
name = "agent-showdown"
version = "0.1.0"
description = "agent-showdown CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dependency-injector>=4.41",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
agent-showdown = "agent_showdown.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_showdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
